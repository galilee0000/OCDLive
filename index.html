<sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
<main style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-direction: column; gap: 36px">

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #B4470A">Réservation</span>
<h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.02em">Choisissez votre jour et votre heure</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3F3F46; max-width: 640px">Le plateau ouvre le <strong style="color: #0B0B0C">mardi 1er décembre 2026</strong>. Les créneaux affichés sont ceux encore libres, de 9 h à 22 h. Votre créneau est bloqué dès que le paiement Mobile Money est validé.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 28px">

<!-- 1. Formule -->
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #0B0B0C; color: #FFC79A; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; flex: none">1</span>
<h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 21px">Votre formule</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<sc-for list="{{pkgs}}" as="p" hint-placeholder-count="3">
<button class="opt" type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%">
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 17px">{{p.name}}</span>
<span style="{{p.dot}}"></span>
</span>
<span style="font-size: 14px; opacity: 0.8">{{p.durLabel}} de live</span>
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 20px">{{p.priceLabel}}</span>
</button>
</sc-for>
</div>
</section>

<!-- 2. Date & heure -->
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 24px; overflow: hidden; display: flex; flex-wrap: wrap">

<div style="flex: 1 1 170px; min-width: 0; padding: 28px 22px; border-right: 1px solid #E4E4E7; display: flex; flex-direction: column; gap: 18px; background: #F6F6F7">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #0B0B0C; color: #FFC79A; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; flex: none">2</span>
<span style="font-size: 14px; font-weight: 600; color: #52525B">OCD Live</span>
</div>
<h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.2">Live {{sumPkg}}</h2>
<div style="display: flex; flex-direction: column; gap: 12px; font-size: 15px; color: #27272A">
<span style="display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{sumDur}}</span>
<span style="display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10.5l5-3v9l-5-3"></path></svg>Plateau OCD Live</span>
<span style="display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 12h4"></path></svg>{{sumPrice}}</span>
</div>
<sc-if value="{{hasTime}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 14px; background: #FFF0E3; color: #8A3405; font-size: 15px">
<span style="font-weight: 600">{{sumDateCap}}</span>
<span>{{sumTime}}</span>
</div>
</sc-if>
</div>

</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #27272A">

</div>

</sc-if>

</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px">

<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #27272A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path></svg>Heure locale du studio</span>
</div>
</div>

<sc-if value="{{hasDay}}" hint-placeholder-val="{{ false }}">

</sc-for>
</div>
</div>
</sc-if>
</section>

<!-- 3. Infos -->
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #0B0B0C; color: #FFC79A; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; flex: none">3</span>
<h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 21px">Vos informations</h2>
</div>

</select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">

<option value="">Choisissez votre domaine</option>
<option value="Créateur de contenu / influenceur">Créateur de contenu / influenceur</option>
<option value="Commerce et vente en ligne">Commerce et vente en ligne</option>
<option value="Mode, beauté et cosmétiques">Mode, beauté et cosmétiques</option>
<option value="Restauration et alimentation">Restauration et alimentation</option>
<option value="Église et ministère">Église et ministère</option>
<option value="Association et communauté">Association et communauté</option>
<option value="Entreprise et services">Entreprise et services</option>
<option value="Musique et arts">Musique et arts</option>
<option value="Éducation et formation">Éducation et formation</option>
<option value="Sport">Sport</option>
<option value="Média et journalisme">Média et journalisme</option>
<option value="Événementiel">Événementiel</option>
<option value="Autre">Autre</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-phone" style="font-size: 14px; font-weight: 600">Numéro de téléphone</label>
<div style="display: flex; gap: 8px">
<span style="height: 50px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 14px; font-size: 15px; font-weight: 600; background: #F1F1F3; color: #0B0B0C; display: inline-flex; align-items: center; flex: none">{{cc}}</span>
<input id="f-phone" type="tel" inputmode="tel" value="{{phone}}" onChange="{{onPhone}}" placeholder="Votre numéro" autocomplete="tel-national" style="height: 50px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #F6F6F7; color: #0B0B0C; flex: 1 1 auto; min-width: 0">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-topic" style="font-size: 14px; font-weight: 600">Sujet du live</label>
<input id="f-topic" type="text" value="{{topic}}" onChange="{{onTopic}}" placeholder="Ex. Vente de mes nouveaux modèles" style="height: 50px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #F6F6F7; color: #0B0B0C">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-guests" style="font-size: 14px; font-weight: 600">Nombre de personnes sur le plateau</label>
<select id="f-guests" value="{{guests}}" onChange="{{onGuests}}" style="height: 50px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 12px; font-size: 16px; background: #F6F6F7; color: #0B0B0C">
<option data-sc-for="guestOptions" data-sc-as="g" value="{{g.v}}">{{g.label}}</option>
</select>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Plateforme(s) de diffusion</span>

</sc-for>
</div>
<span style="font-size: 13px; color: #52525B">{{platformHint}}</span>
</div>
</section>

<!-- 4. Paiement Mobile Money -->
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #0B0B0C; color: #FFC79A; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; flex: none">4</span>
<h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 21px">Payer avec Mobile Money</h2>
</div>
<p style="margin: 0; font-size: 15px; color: #52525B">{{opsIntro}}</p>

<sc-if value="{{m.noLogo}}" hint-placeholder-val="{{ false }}"><span style="{{m.badge}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M10 18.5h4"></path><path d="M9.5 9.5h5"></path><path d="M12 7v5"></path></svg></span></sc-if>
<span style="display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0">
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px">{{m.label}}</span>
<span style="font-size: 12px; color: #52525B; line-height: 1.35">{{m.countries}}</span>
</span>
<span style="{{m.check}}" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</button>
</sc-for>
</div>

<sc-if value="{{hasOp}}" hint-placeholder-val="{{ false }}">
<div style="{{opPanelStyle}}">
<div style="display: flex; align-items: center; gap: 14px">
<sc-if value="{{opHasLogo}}" hint-placeholder-val="{{ false }}"><img src="{{opLogo}}" alt="{{opLabel}}" style="width: 84px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; display: block; border: 1px solid #E4E4E7"></sc-if>
<sc-if value="{{opNoLogo}}" hint-placeholder-val="{{ true }}"><span style="{{opBadgeLg}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M10 18.5h4"></path><path d="M9.5 9.5h5"></path><path d="M12 7v5"></path></svg></span></sc-if>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px">Payer avec {{opLabel}}</span>
<span style="font-size: 14px; color: #52525B">Montant : <strong style="color: #0B0B0C">{{sumPrice}}</strong></span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-paynum" style="font-size: 14px; font-weight: 600">Entrez votre numéro {{opLabel}}</label>
<div style="display: flex; gap: 8px; max-width: 460px">
<span style="height: 54px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 14px; font-size: 16px; font-weight: 600; background: #FFFFFF; color: #0B0B0C; display: inline-flex; align-items: center; flex: none">{{cc}}</span>
<input id="f-paynum" type="tel" inputmode="numeric" value="{{payNumber}}" onChange="{{onPayNumber}}" placeholder="Numéro qui va payer" style="height: 54px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 14px; font-size: 18px; letter-spacing: 0.04em; background: #FFFFFF; color: #0B0B0C; flex: 1 1 auto; min-width: 0">
</div>
<sc-if value="{{canUsePhone}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{usePhone}}" style="align-self: flex-start; background: none; border: 0; padding: 6px 0; color: #B4470A; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 32px">Utiliser mon numéro de téléphone ({{cc}} {{phone}})</button>
</sc-if>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.55; color: #27272A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4470A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.5v.5"></path></svg>
<span>Après avoir cliqué sur « Payer », une demande de paiement arrive sur ce téléphone. Validez-la avec votre code secret {{opLabel}}. OCD Live ne vous demandera jamais votre code.</span>
</div>
</div>
</sc-if>
</section>
</div>

<!-- Récapitulatif -->
<aside style="flex: 1 1 340px; min-width: 0; background: #0B0B0C; color: #FFFFFF; border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 22px; border: 1px solid #FF9A45; box-shadow: 0 0 70px -10px rgba(240,104,0,0.5)">
<h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 20px">Votre réservation</h2>

<div style="display: flex; justify-content: space-between; gap: 16px"><span style="color: #A1A1AA">Date</span><span style="font-weight: 600; text-align: right">{{sumDate}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 16px"><span style="color: #A1A1AA">Horaire</span><span style="font-weight: 600; text-align: right">{{sumTime}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 16px"><span style="color: #A1A1AA">Paiement</span><span style="font-weight: 600; text-align: right">{{sumPay}}</span></div>
</div>
<div style="border-top: 1px solid #2E2E33; padding-top: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-size: 15px; color: #A1A1AA">Total</span>
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 30px; color: #FFC79A">{{sumPrice}}</span>
</div>
<button class="btn-main" type="button" onClick="{{startPay}}" disabled="{{cannotPay}}" style="{{payBtnStyle}}">{{payBtnLabel}}</button>
<span style="font-size: 13px; line-height: 1.5; color: #A1A1AA; text-align: center">{{missingHint}}</span>
</aside>

</div>
</main>
</sc-if>

<sc-if value="{{payOpen}}" hint-placeholder-val="{{ false }}">

<div role="dialog" aria-modal="true" aria-labelledby="pay-title" style="width: 100%; max-width: 440px; background: #FFFFFF; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5)">
<div style="{{modalHeadStyle}}">
<sc-if value="{{opHasLogo}}" hint-placeholder-val="{{ false }}"><img src="{{opLogo}}" alt="{{opLabel}}" style="height: 44px; width: 66px; object-fit: cover; border-radius: 8px; display: block"></sc-if>
<sc-if value="{{opNoLogo}}" hint-placeholder-val="{{ true }}"><span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 18px">{{opLabel}}</span></sc-if>
<span style="font-size: 14px; font-weight: 600">{{sumPrice}}</span>
</div>

<sc-if value="{{payPending}}" hint-placeholder-val="{{ true }}">
<div style="padding: 32px 28px; display: flex; flex-direction: column; gap: 22px; align-items: center; text-align: center">
<span class="spin" style="{{spinnerStyle}}"></span>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 id="pay-title" style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 22px">Validez sur votre téléphone</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F3F46">Une demande de paiement de <strong style="color: #0B0B0C">{{sumPrice}}</strong> a été envoyée au <strong style="color: #0B0B0C">{{payNumFull}}</strong>. Entrez votre code secret {{opLabel}} pour confirmer.</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: left; font-size: 15px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2E7D4F; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Demande envoyée à {{opLabel}}</div>
<div class="pulse" style="display: flex; align-items: center; gap: 12px; font-weight: 600"><span style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #F06800; flex: none"></span>En attente de votre code secret…</div>
<div style="display: flex; align-items: center; gap: 12px; color: #6E6E78"><span style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #E4E4E7; flex: none"></span>Créneau réservé</div>
</div>
<span style="font-size: 13px; color: #5F5F68">La demande expire dans {{countdown}} s</span>
<div style="display: flex; flex-direction: column; gap: 10px; width: 100%">
<button class="btn-main" type="button" onClick="{{simulateOk}}" style="width: 100%; min-height: 52px; border-radius: 999px; border: 0; background: #F06800; color: #0B0B0C; font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; cursor: pointer">J'ai validé sur mon téléphone</button>
<button type="button" onClick="{{cancelPay}}" style="width: 100%; min-height: 48px; border-radius: 999px; border: 1.5px solid #D4D4D8; background: #FFFFFF; color: #0B0B0C; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">Annuler</button>
</div>
</div>
</sc-if>

<sc-if value="{{paySuccess}}" hint-placeholder-val="{{ false }}">
<div style="padding: 36px 28px; display: flex; flex-direction: column; gap: 22px; align-items: center; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #2E7D4F; display: inline-flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 24px">Paiement réussi</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F3F46">{{sumPrice}} payés avec {{opLabel}}.<br>Transaction n° <strong style="color: #0B0B0C">{{txId}}</strong></p>
</div>
<button class="btn-main" type="button" onClick="{{finish}}" style="width: 100%; min-height: 52px; border-radius: 999px; border: 0; background: #F06800; color: #0B0B0C; font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; cursor: pointer">Voir ma réservation</button>
</div>
</sc-if>

<sc-if value="{{payExpired}}" hint-placeholder-val="{{ false }}">
<div style="padding: 36px 28px; display: flex; flex-direction: column; gap: 20px; align-items: center; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #FFF0E3; display: inline-flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B4470A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 22px">La demande a expiré</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F3F46">Aucun montant n'a été débité. Vérifiez que votre compte {{opLabel}} a assez de solde, puis réessayez.</p>
</div>
<button class="btn-main" type="button" onClick="{{startPay}}" style="width: 100%; min-height: 52px; border-radius: 999px; border: 0; background: #F06800; color: #0B0B0C; font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; cursor: pointer">Renvoyer la demande</button>
<button type="button" onClick="{{cancelPay}}" style="width: 100%; min-height: 48px; border-radius: 999px; border: 1.5px solid #D4D4D8; background: #FFFFFF; color: #0B0B0C; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">Changer d'opérateur</button>
</div>
</sc-if>

</div>
</div>
</sc-if>

<!-- Confirmation -->
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch); scheduleRender(); }
  forceUpdate() { scheduleRender(); }
}

class MainPage extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 0 };
  }
  renderVals() {
    const list = [
      { q: "Faut-il apporter son matériel ?", a: "Non. Caméras, lumières, micros, ordinateur de diffusion et connexion internet sont fournis. Apportez seulement votre sujet, vos visuels si vous en avez, et vos invités." },
      { q: "Le live passe sur mon propre compte ?", a: "Oui. On connecte votre compte TikTok, Facebook ou YouTube à notre régie le jour J : vos abonnés vous retrouvent chez vous, avec une image de studio." },
      { q: "Puis-je venir avec des invités ?", a: "Bien sûr. La formule Essentiel convient pour 1 personne, Premium jusqu'à 3 invités et Prestige jusqu'à 6 invités sur le plateau." },
      { q: "Et si je dois changer de date ?", a: "Prévenez-nous au moins 48 h avant votre créneau : on déplace votre live gratuitement sur un autre jour disponible." },
      { q: "Puis-je prolonger mon live sur place ?", a: "Si le créneau suivant est libre, oui. L'équipe vous le confirme pendant le live et le temps en plus se règle sur place." },
      { q: "Comment je paie depuis l'étranger ?", a: "Demandez à un proche en Afrique de payer avec son Mobile Money : il entre son propre numéro au moment du paiement, et la réservation reste à votre nom." }
    ];
    const open = this.state.open;
    return {
      faqs: list.map((f, i) => ({
        q: f.q, a: f.a,
        open: open === i,
        openStr: open === i ? 'true' : 'false',
        iconStyle: 'flex: none; width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; transition: transform .2s ease; ' + (open === i ? 'background: #F06800; color: #0B0B0C; transform: rotate(45deg)' : 'background: #F1F1F3; color: #0B0B0C'),
        toggle: () => this.setState({ open: open === i ? -1 : i })
      }))
    };
  }
}


class BookingPage extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      pkg: null, month: 0, day: null, time: null,
      name: '', country: 'CM', activity: '', phone: '', topic: '', guests: '1',

      pay: 'idle', countdown: 60, txId: '', done: false, ref: ''
    };
  }
  componentWillUnmount() { this.stopTimer(); }
  stopTimer() { if (this._t) { clearInterval(this._t); this._t = null; } }
  fmtPrice(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' FCFA'; }
  hm(mins) { const h = Math.floor(mins / 60), m = mins % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }

  top() { try { window.scrollTo(0, 0); } catch (e) {} }
  renderVals() {
    const S = this.state;
    const P = {
      essentiel: { name: 'Essentiel', dur: 60, price: 10000, durLabel: '1 h', max: 1, plats: 1 },
      premium: { name: 'Premium', dur: 150, price: 30000, durLabel: '2 h 30', max: 4, plats: 2 },
      prestige: { name: 'Prestige', dur: 240, price: 50000, durLabel: '4 h', max: 7, plats: 4 }
    };
    const pkgKey = S.pkg || this.props.defaultPackage || 'premium';
    const pk = P[pkgKey] || P.premium;

    const pkgs = Object.keys(P).map((k) => {
      const on = k === pkgKey;
      return {
        name: P[k].name, durLabel: P[k].durLabel, priceLabel: this.fmtPrice(P[k].price),
        pressed: on ? 'true' : 'false',
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px; border-radius: 16px; cursor: pointer; text-align: left; min-height: 44px; font-family: Inter, sans-serif; ' + (on ? 'background: #0B0B0C; color: #FFFFFF; border: 1.5px solid #0B0B0C; box-shadow: 0 0 0 1px #FF9A45, 0 10px 30px -12px rgba(240,104,0,0.7)' : 'background: #F6F6F7; color: #0B0B0C; border: 1.5px solid #E4E4E7'),
        dot: 'width: 18px; height: 18px; border-radius: 50%; flex: none; ' + (on ? 'background: #F06800; box-shadow: inset 0 0 0 4px #0B0B0C, 0 0 0 1.5px #FF9A45' : 'border: 1.5px solid #D4D4D8'),
        pick: () => this.setState({ pkg: k, time: null, guests: '1' })
      };
    });

    const MN = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    const MS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    const DN = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const WD = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
    const isoOf = (dt) => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    const closed = { '2026-12-25': 'Noël', '2027-01-01': 'Nouvel an' };
    const OPEN = 9 * 60, CLOSE = 22 * 60;
    const months = [{ y: 2026, m: 11 }, { y: 2027, m: 0 }, { y: 2027, m: 1 }];
    const cur = months[S.month];
    const first = (new Date(cur.y, cur.m, 1).getDay() + 6) % 7;
    const nDays = new Date(cur.y, cur.m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < first; i++) cells.push({ blank: true, isDay: false });
    for (let d = 1; d <= nDays; d++) {
      const dt = new Date(cur.y, cur.m, d);
      const iso = isoOf(dt);
      const off = iso < '2026-12-01' || !!closed[iso];
      const sel = S.day === iso;
      const opening = iso === '2026-12-01';
      cells.push({
        blank: false, isDay: true, n: d, disabled: off, pressed: sel ? 'true' : 'false',
        aria: DN[dt.getDay()] + ' ' + d + ' ' + MN[cur.m] + ' ' + cur.y + (off ? ', indisponible' : ', disponible'),
        dotStyle: 'width: 5px; height: 5px; border-radius: 50%; margin-top: 2px; ' + (opening ? (sel ? 'background: #FFFFFF' : 'background: #F06800') : 'background: transparent'),

    if (S.day) {
      for (let t = OPEN; t + pk.dur <= CLOSE; t += 60) {
        const tk = this.taken(S.day, t);
        const sel = S.time === t;
        slots.push({
          label: tk ? this.hm(t) + ' · complet' : (sel ? this.hm(t) + ' → ' + this.hm(t + pk.dur) : this.hm(t)),

          pick: () => this.setState({ time: t })
        });
      }
    }
    let dayLabel = '—';
    if (S.day) {
      const [yy, mm, dd] = S.day.split('-').map(Number);
      const dt = new Date(yy, mm - 1, dd);

          if (!on) { next = plats.concat([l]); if (next.length > pk.plats) next = next.slice(next.length - pk.plats); }

        style: 'display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 76px; border-radius: 16px; cursor: pointer; font-family: Inter, sans-serif; color: #0B0B0C; ' + (on ? 'background: ' + o.tint + '; border: 2px solid #F06800' : 'background: #F6F6F7; border: 2px solid #E4E4E7'),
        pick: () => this.setState({ op: o.k, pay: 'idle' })
      };
    });

    const digits = (x) => x.replace(/\D/g, '');
    const missing = [];
    if (!S.day) missing.push('un jour');
    if (S.day && S.time === null) missing.push('une heure');
    if (!S.name.trim()) missing.push('votre nom');
    if (!S.activity) missing.push('votre domaine d\u2019activité');
    if (digits(S.phone).length < 6) missing.push('votre numéro de téléphone');
    if (!op) missing.push('votre opérateur Mobile Money');
    else if (digits(S.payNumber).length < 6) missing.push('votre numéro ' + op.label);
    const cannot = missing.length > 0;
    const timeLabel = S.time === null ? '—' : this.hm(S.time) + ' → ' + this.hm(S.time + pk.dur);

    const startPay = () => {
      if (cannot) return;
      this.stopTimer();
      this.setState({ pay: 'pending', countdown: 60 });
      this._t = setInterval(() => {
        const c = this.state.countdown - 1;
        if (c <= 0) { this.stopTimer(); this.setState({ pay: 'expired', countdown: 0 }); }
        else this.setState({ countdown: c });
      }, 1000);
    };

    return {
      showForm: !S.done, done: S.done,
      pkgs,
      monthLabel: MN[cur.m] + ' ' + cur.y, cells,
      prevDisabled: S.month === 0, nextDisabled: S.month === months.length - 1,
      prevStyle: navStyle(S.month === 0), nextStyle: navStyle(S.month === months.length - 1),
      prevMonth: () => this.setState({ month: Math.max(0, S.month - 1) }),
      nextMonth: () => this.setState({ month: Math.min(months.length - 1, S.month + 1) }),
      noDay: !S.day, hasDay: !!S.day, hasTime: !!S.day && S.time !== null, slots,
      sumDateCap: dayLabel.charAt(0).toUpperCase() + dayLabel.slice(1),
      name: S.name, cc: ctry.cc, country: ctry.k, countryOptions, activity: S.activity,
      activityColor: S.activity ? '#0B0B0C' : '#5F5F68',
      onCountry: (e) => this.setState({ country: e.target.value }),
      onActivity: (e) => this.setState({ activity: e.target.value }),
      opsIntro: 'Choisissez votre opérateur Mobile Money :', phone: S.phone, topic: S.topic, guests: S.guests, guestOptions,
      onName: (e) => this.setState({ name: e.target.value }),
      onPhone: (e) => this.setState({ phone: e.target.value }),
      onTopic: (e) => this.setState({ topic: e.target.value }),
      onGuests: (e) => this.setState({ guests: e.target.value }),
      platforms,
      platformHint: pk.plats === 1 ? 'La formule Essentiel inclut 1 plateforme.' : (pk.plats === 2 ? 'La formule Premium inclut jusqu’à 2 plateformes en même temps.' : 'La formule Prestige diffuse sur toutes vos plateformes en même temps.'),
      ops, hasOp: !!op, opLabel: op ? op.label : '',
      opLogo: op && op.logo ? op.logo : '', opHasLogo: !!(op && op.logo), opNoLogo: !(op && op.logo),
      opPanelStyle: 'display: flex; flex-direction: column; gap: 18px; padding: 22px; border-radius: 18px; border: 1px solid #E4E4E7; background: ' + (op ? op.tint : '#F6F6F7'),
      opBadgeLg: 'width: 84px; height: 56px; border-radius: 12px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: ' + (op ? op.bg : '#0B0B0C') + '; color: ' + (op ? op.fg : '#FFFFFF'),
      payNumber: S.payNumber, onPayNumber: (e) => this.setState({ payNumber: e.target.value }),
      canUsePhone: digits(S.phone).length >= 6 && digits(S.payNumber) !== digits(S.phone),
      usePhone: () => this.setState({ payNumber: S.phone }),
      payNumFull: ctry.cc + ' ' + S.payNumber, phoneFull: ctry.cc + ' ' + S.phone,
      sumPkg: pk.name, sumDur: pk.durLabel, sumDate: dayLabel, sumTime: timeLabel,
      sumPay: op ? op.label : '—', sumPrice: this.fmtPrice(pk.price),
      cannotPay: cannot,
      payBtnLabel: 'Payer ' + this.fmtPrice(pk.price),
      payBtnStyle: 'width: 100%; min-height: 56px; border-radius: 999px; border: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 17px; ' + (cannot ? 'background: #2E2E33; color: #A1A1AA' : 'background: #F06800; color: #0B0B0C; cursor: pointer'),
      missingHint: cannot ? 'Il manque : ' + missing.join(', ') + '.' : 'Vous allez recevoir une demande de paiement ' + (op ? op.label : '') + ' sur votre téléphone.',
      startPay,
      payOpen: S.pay !== 'idle',
      payPending: S.pay === 'pending', paySuccess: S.pay === 'success', payExpired: S.pay === 'expired',
      countdown: S.countdown,
      modalHeadStyle: 'display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 24px; background: ' + (op ? op.bg : '#0B0B0C') + '; color: ' + (op ? op.fg : '#FFFFFF'),
      spinnerStyle: 'width: 56px; height: 56px; border-radius: 50%; border: 5px solid #F1F1F3; border-top-color: ' + (op ? op.bg : '#F06800') + '; display: inline-block',
      simulateOk: () => {
        this.stopTimer();
        const tx = 'MP' + String(Date.now()).slice(-9);
        this.setState({ pay: 'success', txId: tx });
      },
      cancelPay: () => { this.stopTimer(); this.setState({ pay: 'idle' }); },
      finish: () => {
        const [, mm, dd] = S.day.split('-');
        const ref = 'OCD-' + dd + mm + '-' + this.hm(S.time).replace(':', '');
        this.setState({ pay: 'idle', done: true, ref: ref });
        this.top();
      },
      txId: S.txId,
      reset: () => { this.stopTimer(); this.setState({ done: false, day: null, time: null, op: null, payNumber: '', pay: 'idle', txId: '', ref: '' }); this.top(); },
      ref: S.ref,
      firstName: (S.name.trim().split(/\s+/)[0]) || ''
    };
  }
}

(function () {
  const app = document.getElementById('app');
  const tpls = { main: document.getElementById('tpl-main').content, res: document.getElementById('tpl-res').content };
  let current = null, route = null, queued = false;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let v = scope;
    for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function whole(str) { const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; }
  function interp(str, scope) { return str.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); }); }
  function renderNodes(src, scope, out) { for (const n of src.childNodes) renderNode(n, scope, out); }
  function renderNode(n, scope, out) {
    if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = lookup(whole(n.getAttribute('list')) || '', scope) || [];
      const as = n.getAttribute('as') || 'item';
      list.forEach((it, i) => { const s = Object.assign({}, scope, { [as]: it, $index: i }); renderNodes(n, s, out); });
      return;
    }
    if (tag === 'sc-if') { if (lookup(whole(n.getAttribute('value')) || '', scope)) renderNodes(n, scope, out); return; }
    if (n.hasAttribute('data-sc-for')) {
      const list = lookup(n.getAttribute('data-sc-for'), scope) || []; const as = n.getAttribute('data-sc-as');
      list.forEach((it, i) => { const c = n.cloneNode(true); c.removeAttribute('data-sc-for'); c.removeAttribute('data-sc-as'); renderNode(c, Object.assign({}, scope, { [as]: it, $index: i }), out); });
      return;
    }
    const el = n.cloneNode(false);
    let deferredValue;
    for (const a of Array.from(n.attributes)) {
      const name = a.name, val = a.value;
      if (name.startsWith('hint-')) { el.removeAttribute(name); continue; }
      const w = whole(val);
      if (name.startsWith('on')) {
        el.removeAttribute(name);
        const fn = w ? lookup(w, scope) : null;
        if (typeof fn === 'function') {
          let ev = name.slice(2);
          if (ev === 'change' && (tag === 'input' || tag === 'textarea')) ev = 'input';
          el.addEventListener(ev, fn);
        }
        continue;
      }
      if (w !== null) {
        const v = lookup(w, scope);
        if (name === 'value') { el.removeAttribute(name); deferredValue = v == null ? '' : String(v); continue; }
        if (name === 'disabled') { el.removeAttribute(name); if (v) el.setAttribute('disabled', ''); continue; }
        if (v === false || v == null) { el.removeAttribute(name); continue; }
        el.setAttribute(name, v === true ? '' : String(v));
      } else if (val.indexOf('{{') >= 0) {
        if (name === 'value') { el.removeAttribute(name); deferredValue = interp(val, scope); continue; }
        el.setAttribute(name, interp(val, scope));
      }
    }
    renderNodes(n, scope, el);
    if (deferredValue !== undefined) { el.value = deferredValue; if (tag === 'input') el.setAttribute('value', deferredValue); }
    out.appendChild(el);
  }
  function render() {
    queued = false;
    if (!current) return;
    const ae = document.activeElement, fid = ae && ae.id, sel = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
    const frag = document.createDocumentFragment();
    renderNodes(current.tpl, current.comp.renderVals(), frag);
    app.replaceChildren(frag);
    if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  }
  window.scheduleRender = function () { if (!queued) { queued = true; Promise.resolve().then(render); } };
  function go() {
    const h = location.hash;
    const m = /^#reserver(?:-(essentiel|premium|prestige))?$/.exec(h);
    const next = m ? 'res:' + (m[1] || '') : 'main';
    if (next === route) return;
    const wasRes = route && route.startsWith('res');
    route = next;
    if (m) {
      const comp = new BookingPage({ defaultPackage: m[1] || 'premium' });
      current = { tpl: tpls.res, comp };
      document.title = 'OCD Live | Réserver votre live';
      render(); window.scrollTo(0, 0);
    } else {
      current = { tpl: tpls.main, comp: current && current.comp instanceof MainPage ? current.comp : new MainPage({}) };
      document.title = 'OCD Live | Studio de lives';
      render();
      const target = h && h.length > 1 && h !== '#accueil' ? document.getElementById(h.slice(1)) : null;
      if (target) target.scrollIntoView(); else if (wasRes || h === '#accueil') window.scrollTo(0, 0);
    }
  }
  window.addEventListener('hashchange', go);
  go();
})();
</script>
